<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BZlikely</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:white;
  width:100%;
  max-width:420px;
  padding:28px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}
h2{text-align:center;margin-top:0}
p{text-align:center;color:#667085;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:8px;
  background:#087f5b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
#message{
  margin-top:16px;
  text-align:center;
  line-height:1.5;
  overflow-wrap:anywhere;
}
a{color:#087f5b}
</style>
</head>

<body>
<div class="card">
  <h2>BZlikely</h2>
  <p>Set a new password for your publisher account.</p>

  <form id="resetForm" hidden>
    <label for="password">New Password</label>
    <input
      type="password"
      id="password"
      minlength="8"
      autocomplete="new-password"
      placeholder="Enter new password"
      required
    >

    <label for="confirmPassword">Confirm New Password</label>
    <input
      type="password"
      id="confirmPassword"
      minlength="8"
      autocomplete="new-password"
      placeholder="Confirm new password"
      required
    >

    <button type="submit" id="submitBtn">Update Password</button>
  </form>

  <div id="message">Verifying your password reset link...</div>
</div>

<script>
const SUPABASE_URL = "https://acnpjyluvhvckrncqkyz.supabase.co";

// Supabase se apni current Publishable Key yahan paste karo.
const SUPABASE_KEY = "sb_publishable_dXscx_nGVSXi8lm6qgra_Q_VqAGIXaZ";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let recoveryVerified = false;

function showMessage(text, success=false){
  message.textContent = text;
  message.style.color = success ? "#087f5b" : "#c0392b";
}

function showForm(){
  recoveryVerified = true;
  form.hidden = false;
  message.textContent = "Enter and confirm your new password.";
  message.style.color = "#087f5b";
}

async function checkRecoverySession(){
  try{
    const {data, error} = await supabase.auth.getSession();

    if(error) throw error;

    if(data.session){
      showForm();
      return;
    }

    showMessage(
      "Invalid or expired reset link. Please request a new password reset email."
    );
  }catch(error){
    showMessage(error.message || "Unable to verify reset link.");
  }
}

supabase.auth.onAuthStateChange((event, session)=>{
  if(event === "PASSWORD_RECOVERY" && session){
    showForm();
  }
});

checkRecoverySession();

form.addEventListener("submit", async function(e){
  e.preventDefault();

  if(!recoveryVerified){
    showMessage("Please open a valid password reset link first.");
    return;
  }

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(password.length < 8){
    showMessage("Password must contain at least 8 characters.");
    return;
  }

  if(password !== confirmPassword){
    showMessage("Passwords do not match.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating...";

  try{
    const {error} = await supabase.auth.updateUser({
      password: password
    });

    if(error) throw error;

    form.hidden = true;
    showMessage("Password updated successfully! You can now log in.", true);

    await supabase.auth.signOut();

    const loginUrl = new URL(
      "publisher-login.html",
      window.location.href
    );

    const link = document.createElement("a");
    link.href = loginUrl.href;
    link.textContent = "Go to Publisher Login";
    link.style.display = "block";
    link.style.textAlign = "center";
    link.style.marginTop = "18px";

    message.appendChild(document.createElement("br"));
    message.appendChild(link);

  }catch(error){
    showMessage(error.message || "Password update failed.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Update Password";
  }
});
</script>
</body>
</html>
