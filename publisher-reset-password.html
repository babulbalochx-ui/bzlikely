
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BZlikely</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;font-family:Arial,sans-serif;
  background:#f3f6fb;color:#172033;
  min-height:100vh;display:flex;
  align-items:center;justify-content:center
}
.card{
  background:white;width:100%;max-width:420px;
  padding:28px;border-radius:16px;
  box-shadow:0 5px 25px #00000012
}
h2{text-align:center}
p{text-align:center;color:#667085;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{
  width:100%;padding:13px;border:1px solid #ccd3df;
  border-radius:8px;font-size:16px
}
button{
  width:100%;padding:14px;margin-top:22px;
  border:0;border-radius:8px;background:#087f5b;
  color:white;font-size:16px;font-weight:bold
}
#message{text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
  <h2>BZlikely</h2>
  <p>Set a new password for your publisher account.</p>

  <form id="resetForm" hidden>
    <label>New Password</label>
    <input id="password" type="password" minlength="8"
      autocomplete="new-password" required>

    <label>Confirm New Password</label>
    <input id="confirmPassword" type="password" minlength="8"
      autocomplete="new-password" required>

    <button id="submitBtn" type="submit">Update Password</button>
  </form>

  <p id="message">Verifying your password reset link...</p>
</div>

<script>
const SUPABASE_URL = "https://acnpjyluvhvckrncqkyz.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_CURRENT_PUBLISHABLE_KEY_HERE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let recoveryVerified = false;

function showMessage(text, success=false){
  message.textContent = text;
  message.style.color = success ? "#087f5b" : "#c0392b";
}

function showForm(){
  recoveryVerified = true;
  form.hidden = false;
  showMessage("Enter your new password.", true);
}

async function initializeRecovery(){
  try{
    const {error: initError} =
      await supabaseClient.auth.initialize();

    if(initError) throw initError;

    const {data, error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    if(data.session){
      showForm();
    }else{
      showMessage(
        "Reset link is invalid or expired. Please request a new reset email."
      );
    }
  }catch(error){
    showMessage(error.message || "Unable to verify reset link.");
  }
}

supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event === "PASSWORD_RECOVERY" && session){
    showForm();
  }
});

initializeRecovery();

form.addEventListener("submit", async function(event){
  event.preventDefault();

  if(!recoveryVerified){
    showMessage("Please open a valid reset email link.");
    return;
  }

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(password.length < 8){
    showMessage("Password must be at least 8 characters.");
    return;
  }

  if(password !== confirmPassword){
    showMessage("Passwords do not match.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Updating...";

  try{
    const {error} = await supabaseClient.auth.updateUser({
      password: password
    });

    if(error) throw error;

    showMessage("Password updated successfully!", true);
    form.hidden = true;

    await supabaseClient.auth.signOut();

    const link = document.createElement("a");
    link.href = "publisher-login.html";
    link.textContent = "Go to Publisher Login";
    link.style.display = "block";
    link.style.textAlign = "center";
    link.style.marginTop = "18px";

    message.appendChild(document.createElement("br"));
    message.appendChild(link);

  }catch(error){
    showMessage(error.message || "Password update failed.");
    submitBtn.disabled = false;
    submitBtn.textContent = "Update Password";
  }
});
</script>
</body>
</html>
