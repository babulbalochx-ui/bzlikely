
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>BZlikely | Redirecting</title>

<style>
*{box-sizing:border-box}

body{
 font-family:Arial,sans-serif;
 background:#f4f6fa;
 color:#172033;
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 margin:0;
 text-align:center;
 padding:20px;
}

.box{
 background:white;
 padding:30px;
 border-radius:14px;
 max-width:380px;
 width:100%;
 box-shadow:0 5px 25px #00000012;
}

h2{
 color:#1746a2;
 margin-top:0;
}

p{
 line-height:1.6;
 color:#667085;
 overflow-wrap:anywhere;
}

</style>
</head>

<body>

<div class="box">
 <h2>BZlikely</h2>

 <p id="message" role="status" aria-live="polite">
  Please wait. Redirecting...
 </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://acnpjyluvhvckrncqkyz.supabase.co";
const SUPABASE_KEY="sb_publishable_dXscx_nGVSXi8lm6qgra_Q_VqAGIXaZ";

const message=document.getElementById("message");

async function redirectVisitor(){

 try{

  if(!window.supabase){
   throw new Error("Supabase unavailable");
  }

  const db=window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );

  const params=new URLSearchParams(window.location.search);
  const linkId=params.get("id");

  const uuidPattern=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  if(!linkId||!uuidPattern.test(linkId)){
   message.textContent="This tracking link is invalid.";
   return;
  }

  const {data,error}=await db.rpc(
   "track_publisher_link",
   {p_link_id:linkId}
  );

  if(error){
   throw error;
  }

  if(typeof data!=="string"||!data.trim()){
   message.textContent="This link is unavailable.";
   return;
  }

  let destination;

  try{
   destination=new URL(data);
  }catch{
   message.textContent="This destination link is invalid.";
   return;
  }

  if(
   (destination.protocol!=="https:"&&
    destination.protocol!=="http:")||
   destination.username||
   destination.password
  ){
   message.textContent="This destination is not allowed.";
   return;
  }

  message.textContent="Redirecting you now...";

  window.location.replace(destination.href);

 }catch(error){

  console.error("BZlikely tracking error:",error);

  message.textContent=
   "Unable to open this link right now. Please try again later.";

 }
}

redirectVisitor();
</script>

</body>
</html>
